# Basic Connection
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.url=jdbc:h2:mem:fire_nation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=


# Initialization
spring.sql.init.mode=always
# ensure this file exists in src/main/resources/
spring.sql.init.data-locations=classpath:h2init.sql

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# This allows the console to work if you have Spring Security
#spring.h2.console.settings.web-allow-others=true

# Vis SQL i logs (nyttigt i testfasen)
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
