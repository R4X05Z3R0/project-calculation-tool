<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" th:href="@{/css/create-project.css}">
	<title>Create Project</title>
</head>
<body>
<h2>Add a New Project</h2>

<form th:action="@{/projects/create}" th:object="${project}" method="post">
	<div>
		<label for="companyName">Company Name:</label>
		<input type="text" id="companyName" th:field="*{companyName}" required />
	</div>

	<div>
		<label for="projectName">Project Name:</label>
		<input type="text" id="projectName" th:field="*{projectName}" required />
	</div>

	<div>
		<label for="deadline">Target Deadline:</label>
		<input type="date" id="deadline" th:field="*{deadline}" required />
		<p th:if="${invalidDeadline}" th:text="${invalidDeadline}" style="color: red;"></p>
	</div>

	<div>
		<label for="description">Project Context / Description:</label>
		<textarea id="description" th:field="*{description}" rows="4" cols="50"></textarea>
	</div>

	<div style="margin-top: 15px;">
		<button type="submit">Save Changes</button>
		<button type="button"><a th:href="@{/projects/}" style="text-decoration: none; color: red;">Cancel</a></button>

	</div>
</form>
</body>
</html>
