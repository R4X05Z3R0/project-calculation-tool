<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/view-subprojects.css}">
	<title>ASPCT | Subprojects</title>
</head>
<body>

<div>
	<p class="back-link"><a th:href="@{/projects/}">← Back to Projects</a></p>

	<div class="header-container">
		<div class="header-content">
			<h1 th:text="'Subprojects for: ' + ${project.projectName}">Project Name</h1>
			<p class="project-desc" th:text="${project.description}">Project Description</p>
			<p class="project-hours" th:text="'Approximately ' + ${totalHours} + ' hours'">Total Hours</p>
		</div>
		<div class="header-actions">
			<button><a th:href="@{/subprojects/create-form(projectId=${project.projectId})}">+ New Subproject</a></button>
			<button><a th:href="@{/projects/{projectId}/workforce(projectId=${project.projectId})}">View Project Estimates</a></button>
		</div>
	</div>

	<hr>

	<table>
		<thead>
		<tr>
			<th>Subproject Name</th>
			<th>Deadline</th>
			<th>Description</th>
			<th>Task Count</th>
			<th>Actions</th>
		</tr>
		</thead>
		<tbody>
		<tr th:if="${#lists.isEmpty(subProjects)}">
			<td colspan="5">No subprojects found for this project.</td>
		</tr>

		<tr th:each="sub : ${subProjects}">
			<td>
				<a class="subproject-link" th:href="@{/subprojects/{id}/tasks(id=${sub.subProjectId})}"
				   th:text="${sub.name}">Subproject Name</a>
			</td>

			<td th:text="${#temporals.format(sub.deadline, 'dd-MM-yyyy')}">Deadline</td>
			<td th:text="${sub.description}">Description text...</td>
			<td th:text="${#lists.size(sub.tasks)}">0</td>
			<td>
				<a class="edit-link" th:href="@{/subprojects/{subProjectId}/edit-form(subProjectId = ${sub.subProjectId})}">Edit</a> |

				<form th:action="@{/subprojects/{id}/delete(id=${sub.subProjectId})}" method="post">
					<input type="hidden" name="projectId" th:value="${project.projectId}" />
					<button type="submit" class="delete-btn" th:attr="onclick='return confirm(\'Are you sure you want to delete ' + ${sub.name} + '?\');'">
						Delete
					</button>
				</form>
			</td>
		</tr>
		</tbody>
	</table>
</div>

</body>
</html>
