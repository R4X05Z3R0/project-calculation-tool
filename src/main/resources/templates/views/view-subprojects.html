<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ASPCT | Subprojects</title>
</head>
<body>

<div>
	<p><a th:href="@{/projects/}">← Back to Projects</a></p>

	<h1 th:text="'Subprojects for: ' + ${project.projectName}">Project Name</h1>
	<button><a th:href="@{/subprojects/create-form(projectId=${project.projectId})}">+ New Subproject</a></button>
	<button><a th:href="@{/projects/{projectId}/workforce(projectId=${project.projectId})}">View Project Estimates</a></button>
	<p th:text="${project.description}">Project Description</p>
	<p th:text="'Approximately ' + ${totalHours} + ' hours'">Total Hours</p>
</div>

<hr>

<div>
	<table>
		<thead>
		<tr>
			<th>Subproject Name</th>
			<th>Deadline</th>
			<th>Description</th>
			<th>Task Count</th>
			<th>Actions</th>
		</tr>
		</thead>
		<tbody>
		<tr th:if="${#lists.isEmpty(subProjects)}">
			<td>No subprojects found for this project.</td>
		</tr>

		<tr th:each="sub : ${subProjects}">
			<td>
				<a th:href="@{/subprojects/{id}/tasks(id=${sub.subProjectId})}"
			        th:text="${sub.name}">Subproject Name</a>
			</td>

			<td th:text="${#temporals.format(sub.deadline, 'dd-MM-yyyy')}">Deadline</td>
			<td th:text="${sub.description}">Description text...</td>
			<td th:text="${#lists.size(sub.tasks)}">0</td>
			<td>
				<a th:href="@{/subprojects/{subProjectId}/edit-form(subProjectId = ${sub.subProjectId})}">Edit</a>

				<form th:action="@{/subprojects/{id}/delete(id=${sub.subProjectId})}" method="post" style="display:inline; margin-left: 5px;">
					<!-- We supply the active parent project ID so the controller can return here -->
					<input type="hidden" name="projectId" th:value="${project.projectId}" />
					<button type="submit"
					        style="background:none; border:none; color:red; text-decoration:none; cursor:pointer; padding:0; font-family:inherit; font-size:inherit;"
					        th:attr="onclick='return confirm(\'Are you sure you want to delete ' + ${sub.name} + '?\');'">
						Delete
					</button>
				</form>
			</td>
		</tr>
		</tbody>
	</table>
</div>

</body>
</html>
