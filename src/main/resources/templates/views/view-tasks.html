<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ASPCT | Tasks</title>
</head>
<body>

<div>
	<!-- Dynamic back link using the subProjectId from the parent subproject object -->
	<p><a th:href="@{/projects/{subProjectId}/subprojects(subProjectId = ${subProject.projectId})}">← Back to Subproject</a></p>

	<h1 th:text="'Tasks for: ' + ${subProject.name}">Subproject Name</h1>
	<button><a th:href="@{/tasks/new(subProjectId=${subProject.subProjectId})}">+ New Task</a></button>
	<p th:text="${subProject.description}">Subproject Description</p>
	<p th:text="'Approximately ' + ${totalHours} + ' hours'">Total Hours</p>
</div>

<hr>

<div>
	<table>
		<thead>
		<tr>
			<th>Task Name</th>
			<th>Estimated Hours</th>
			<th>Deadline</th>
			<th>Description</th>
			<th>Actions</th>
		</tr>
		</thead>
		<tbody>
		<!-- Displayed if the tasks list passed from the controller is empty -->
		<tr th:if="${#lists.isEmpty(tasks)}">
			<td colspan="5">No tasks found for this subproject.</td>
		</tr>

		<!-- Loop through the List<Task> -->
		<tr th:each="task : ${tasks}">
			<td th:text="${task.name}">
				Task Name
				<!-- Dynamic link to view a specific task's details if needed -->
<!--				<a th:href="@{/tasks/{id}(id=${task.taskId})}"-->
<!--				   th:text="${task.name}">Task Name</a>-->
			</td>

			<!-- Renders the double value for estimated hours -->
			<th:block th:with="hoursLabel=${task.estimatedHours == 1.0} ? ' hour' : ' hours'">
				<td th:text="${task.estimatedHours} + ${hoursLabel}">0.0 hours</td>
			</th:block>

			<!-- Formats the LocalDate field -->
			<td th:text="${#temporals.format(task.deadline, 'dd-MM-yyyy')}">Deadline</td>

			<td th:text="${task.description}">Description text...</td>
			<td>
				<!-- Dynamic action links using taskId -->
				<a th:href="@{/tasks/{taskId}/edit (taskId=${task.taskId})}">Edit</a> |
				<a th:href="@{/tasks/-delete/{id}(id=${task.taskId})}">Delete</a>
			</td>
		</tr>
		</tbody>
	</table>
</div>

</body>
</html>
