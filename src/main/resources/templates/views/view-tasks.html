<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/view-tasks.css}">
	<title>ASPCT | Tasks</title>
</head>
<body>

<div>
	<p class="back-link"><a th:href="@{/projects/{subProjectId}/subprojects(subProjectId = ${subProject.projectId})}">← Back to Subproject</a></p>

	<div class="header-container">
		<div class="header-content">
			<h1 th:text="'Tasks for: ' + ${subProject.name}">Subproject Name</h1>
			<p class="project-desc" th:text="${subProject.description}">Subproject Description</p>
			<p class="project-hours" th:text="'Approximately ' + ${totalHours} + ' hours'">Total Hours</p>
		</div>
		<div class="header-actions">
			<button><a th:href="@{/tasks/create-form(subProjectId=${subProject.subProjectId})}">+ New Task</a></button>
		</div>
	</div>

	<hr>

	<table>
		<thead>
		<tr>
			<th>Task Name</th>
			<th>Estimated Hours</th>
			<th>Deadline</th>
			<th>Description</th>
			<th>Actions</th>
		</tr>
		</thead>
		<tbody>
		<tr th:if="${#lists.isEmpty(tasks)}">
			<td colspan="5">No tasks found for this subproject.</td>
		</tr>

		<tr th:each="task : ${tasks}">
			<td class="project-blue" th:text="${task.name}">Task Name</td>

			<th:block th:with="hoursLabel=${task.estimatedHours == 1.0} ? ' hour' : ' hours'">
				<td th:text="${task.estimatedHours} + ${hoursLabel}">0.0 hours</td>
			</th:block>

			<td th:text="${#temporals.format(task.deadline, 'dd-MM-yyyy')}">Deadline</td>

			<td th:text="${task.description}">Description text...</td>

			<td class="actions-cell">
				<a class="edit-link" th:href="@{/tasks/{taskId}/edit (taskId=${task.taskId})}">Edit</a>
				<span class="actions-separator">|</span>
				<form th:action="@{/tasks/{taskId}/delete(taskId=${task.taskId})}" method="post">
					<input type="hidden" name="subProjectId" th:value="${subProject.subProjectId}" />
					<button type="submit" class="delete-btn" th:attr="onclick='return confirm(\'Are you sure you want to delete ' + ${task.name} + '?\');'">
						Delete
					</button>
				</form>
			</td>
		</tr>
		</tbody>
	</table>
</div>

</body>
</html>
