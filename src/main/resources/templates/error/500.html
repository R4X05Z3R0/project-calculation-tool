<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
	<meta charset="UTF-8">
	<title>Internal Server Error</title>
</head>
<body>

<h1>Error 500 - Something Went Wrong</h1>
<p>An unexpected error occurred on our server. Our team has been notified.</p>

<p th:if="${serverError}" th:text="${serverError}" style="color: gray; font-style: italic;"></p>

<a th:href="@{/projects/}">Back to Safety</a>

</body>
</html>
